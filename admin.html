<!doctype html>
<html lang="tl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0c12"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"><title>SWERTENG LINK Admin</title></head>
<body>
<header class="top"><a class="brand" href="./"><span class="logo">S</span><span><b>SWERTENG LINK</b><small>ADMIN APP</small></span></a><a class="button ghost" href="./">Public Website</a></header>
<main class="container">
<section class="hero compact"><span class="eyebrow">PRIVATE MANAGEMENT</span><h1>Admin Panel</h1><p>Magdagdag, mag-edit, at mag-update ng player links.</p></section>
<div id="setupWarning" class="alert hidden"></div>
<section id="authPanel" class="panel">
<h2>Admin Login</h2><p class="muted">Gamitin ang email at password na ginawa mo sa Supabase Authentication.</p>
<form id="loginForm" class="form"><label>Email<input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label><button class="button primary" type="submit">Mag-login</button></form>
<p id="authMessage" class="status" role="status"></p>
</section>
<section id="appPanel" class="hidden">
<div class="panel account"><div><b id="signedInAs">Naka-login</b><p class="muted">Admin session</p></div><button id="logout" class="button ghost">Logout</button></div>
<section class="panel"><h2 id="formHeading">Magdagdag ng player link</h2>
<form id="linkForm" class="form two">
<input type="hidden" id="editId">
<label>Pangalan ng link<input id="linkName" required maxlength="120" placeholder="Hal. Player Link 01"></label>
<label>Category<input id="linkCategory" required maxlength="60" placeholder="Hal. Main / Featured"></label>
<label class="wide">URL<input id="linkUrl" type="url" required placeholder="https://example.com"></label>
<label class="wide">Description (optional)<textarea id="linkDescription" rows="2" maxlength="300" placeholder="Maikling detalye"></textarea></label>
<label class="check wide"><input id="isActive" type="checkbox" checked> Ipakita sa public website</label>
<div class="actions wide"><button class="button primary" id="saveLink" type="submit">+ Save Link</button><button class="button ghost" id="cancelEdit" type="button">Clear</button></div>
</form><p id="formMessage" class="status" role="status"></p></section>
<section class="panel"><div class="listhead"><h2>Player links</h2><input id="adminSearch" type="search" placeholder="Search links…"></div><p id="listStatus" class="muted"></p><div id="adminLinks"></div></section>
</section>
</main><footer>SWERTENG LINK · Admin</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}</script>
</body></html>
